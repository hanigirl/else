<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>else</title>
  <meta name="description" content="AI can make anything. We make something else.">
  
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    @font-face {
      font-family: "Clash Display";
      src: url("/assets/fonts/clash-display-400.woff2") format("woff2");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "Clash Display";
      src: url("/assets/fonts/clash-display-500.woff2") format("woff2");
      font-weight: 500;
      font-display: swap;
    }
    @font-face {
      font-family: "Clash Display";
      src: url("/assets/fonts/clash-display-600.woff2") format("woff2");
      font-weight: 600;
      font-display: swap;
    }

    :root {
      --color-indigo: #5651ed;
      --color-brand-blue: #1341e9;
      --color-navy: #1a237e;
      --color-cobalt: #4a7af7;
      --color-azure: #0d81e0;
      --color-periwinkle: #98b5fb;
      --color-violet: #7258da;
      --color-rose: #f5859c;
      --color-ink: #383845;
      --color-white: #ffffff;
      --color-snow: #fefefe;
      --color-mist: #eff2fc;
      --color-haze: #e5e7f3;
      --color-hover: #e1e1eb;
      --color-error: #d92d2d;
      --color-success: #069561;
      --color-success-soft: #d5fdee;
      --font-he: 'Noto Sans Hebrew', system-ui, sans-serif;
      --font-en: 'Clash Display', 'Noto Sans Hebrew', system-ui, sans-serif;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --dur-fast: 160ms;
      --dur-base: 320ms;
      --page-margin: 72px;
      --page-max: 1920px;
      --grid-gutter: 32px;
    }

    @media (max-width: 1279px) {
      :root {
        --page-margin: 40px;
        --grid-gutter: 24px;
      }
    }

    @media (max-width: 767px) {
      :root {
        --page-margin: 20px;
        --grid-gutter: 16px;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-he);
      color: var(--color-ink);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      position: relative;
      isolation: isolate;
      background: linear-gradient(180deg, var(--color-snow), var(--color-haze));
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncR type='linear' slope='3' intercept='-1'/><feFuncG type='linear' slope='3' intercept='-1'/><feFuncB type='linear' slope='3' intercept='-1'/></feComponentTransfer></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      background-size: 160px;
      mix-blend-mode: overlay;
      opacity: 0.1;
    }

    .container {
      position: relative;
      max-width: var(--page-max);
      margin: 0 auto;
      padding: 0 var(--page-margin);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding-top: clamp(40px, 6vw, 80px);
      padding-bottom: clamp(32px, 4vw, 48px);
    }

    .logo-img {
      width: clamp(120px, 14vw, 200px);
      height: auto;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(2rem, 4vw, 4rem) 0;
      max-width: 640px;
      margin: 0 auto;
      width: 100%;
    }

    .tagline {
      font-family: var(--font-en);
      font-weight: 500;
      font-size: clamp(18px, 2vw, 24px);
      line-height: 1.3;
      text-align: center;
      margin-bottom: clamp(2.5rem, 5vw, 4rem);
      color: var(--color-ink);
    }

    .signup-box {
      width: 100%;
      max-width: 480px;
      position: relative;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .field-label {
      display: block;
      font-family: var(--font-he);
      font-weight: 500;
      font-size: 16px;
      line-height: 1.4;
      margin-bottom: 8px;
      color: var(--color-ink);
    }

    .email-input {
      width: 100%;
      padding: 16px 20px;
      font-family: var(--font-he);
      font-size: 16px;
      font-weight: 500;
      line-height: 1.4;
      color: var(--color-ink);
      background: var(--color-white);
      border: 2px solid transparent;
      border-radius: 8px;
      transition: all var(--dur-base) var(--ease-out);
      text-align: right;
      box-shadow: 0 1px 3px rgba(56, 56, 69, 0.08);
    }

    .email-input:focus {
      outline: none;
      border-color: var(--color-indigo);
      box-shadow: 0 2px 8px rgba(86, 81, 237, 0.12);
    }

    .email-input::placeholder {
      color: rgba(56, 56, 69, 0.4);
    }

    .email-input[aria-invalid="true"] {
      border-color: var(--color-error);
    }

    .submit-btn {
      width: 100%;
      padding: 16px 20px;
      font-family: var(--font-he);
      font-size: 16px;
      font-weight: 600;
      line-height: 1.4;
      color: var(--color-white);
      background: var(--color-indigo);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all var(--dur-base) var(--ease-out);
      box-shadow: 0 2px 6px rgba(86, 81, 237, 0.2);
    }

    .submit-btn:hover:not(:disabled) {
      background: #4743d4;
      box-shadow: 0 4px 12px rgba(86, 81, 237, 0.3);
      transform: translateY(-1px);
    }

    .submit-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      margin-top: 1rem;
      padding: 12px 16px;
      border-radius: 6px;
      font-family: var(--font-he);
      font-size: 15px;
      font-weight: 500;
      line-height: 1.4;
      text-align: center;
    }

    .message.success {
      background: var(--color-success-soft);
      color: var(--color-success);
    }

    .message.error {
      background: #fee;
      color: var(--color-error);
    }

    .privacy-link {
      margin-top: clamp(2rem, 4vw, 3rem);
      text-align: center;
    }

    .privacy-link a {
      font-family: var(--font-he);
      font-size: 15px;
      font-weight: 500;
      color: var(--color-indigo);
      text-decoration: none;
      transition: opacity var(--dur-base) var(--ease-out);
    }

    .privacy-link a:hover {
      opacity: 0.7;
    }

    footer {
      padding: clamp(2rem, 4vw, 3rem) 0;
      text-align: center;
    }

    .footer-text {
      font-family: var(--font-en);
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.02em;
      color: rgba(56, 56, 69, 0.5);
    }

    .shapes {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      overflow: hidden;
    }

    .shape {
      position: absolute;
      transition: transform var(--dur-base) var(--ease-out);
    }

    .shape-circle {
      width: clamp(80px, 10vw, 140px);
      height: clamp(80px, 10vw, 140px);
      border-radius: 50%;
      background: var(--color-periwinkle);
      opacity: 0.15;
      top: 12%;
      left: 8%;
    }

    .shape-triangle {
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 0 0 clamp(60px, 8vw, 100px) clamp(60px, 8vw, 100px);
      border-color: transparent transparent var(--color-violet) transparent;
      opacity: 0.12;
      bottom: 20%;
      right: 10%;
      transform: rotate(25deg);
    }

    .shape-rect {
      width: clamp(70px, 9vw, 120px);
      height: clamp(70px, 9vw, 120px);
      background: var(--color-azure);
      opacity: 0.1;
      top: 60%;
      left: 5%;
      transform: rotate(-15deg);
    }

    .shape-drop {
      width: clamp(90px, 11vw, 150px);
      height: clamp(90px, 11vw, 150px);
      border-radius: 50% 50% 50% 0;
      background: var(--color-rose);
      opacity: 0.12;
      top: 25%;
      right: 6%;
      transform: rotate(45deg);
    }

    @media (max-width: 767px) {
      .shape-circle {
        top: 8%;
        left: 4%;
      }
      .shape-triangle {
        bottom: 15%;
        right: 5%;
      }
      .shape-rect {
        top: 55%;
        left: 3%;
      }
      .shape-drop {
        top: 20%;
        right: 4%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="shapes" aria-hidden="true">
    <div class="shape shape-circle"></div>
    <div class="shape shape-triangle"></div>
    <div class="shape shape-rect"></div>
    <div class="shape shape-drop"></div>
  </div>

  <div class="container">
    <header>
      <img src="/assets/logo.svg" alt="else" class="logo-img">
    </header>

    <main>
      <h1 class="tagline" lang="en">
        AI can make anything.<br>We make something else.
      </h1>

      <div class="signup-box">
        <form id="signupForm">
          <div class="form-group">
            <label for="email" class="field-label">כתובת מייל</label>
            <input 
              type="email" 
              id="email" 
              class="email-input" 
              placeholder="name@example.com"
              required
              autocomplete="email"
              dir="ltr"
            >
          </div>
          <button type="submit" class="submit-btn" id="submitBtn">
            הצטרפות לרשימת התפוצה
          </button>
          <div id="message"></div>
        </form>

        <div class="privacy-link">
          <a href="/privacy">מדיניות פרטיות</a>
        </div>
      </div>
    </main>

    <footer>
      <p class="footer-text" lang="en">hani.buskila / else</p>
    </footer>
  </div>

  <script>
    const form = document.getElementById('signupForm');
    const emailInput = document.getElementById('email');
    const submitBtn = document.getElementById('submitBtn');
    const messageDiv = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = emailInput.value.trim();
      if (!email) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'שולח...';
      messageDiv.textContent = '';
      messageDiv.className = 'message';
      emailInput.removeAttribute('aria-invalid');

      try {
        const response = await fetch('/api/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await response.json();

        if (response.ok) {
          messageDiv.textContent = 'תודה! נרשמת בהצלחה לרשימת התפוצה ✓';
          messageDiv.className = 'message success';
          emailInput.value = '';
        } else {
          messageDiv.textContent = data.error || 'משהו השתבש. אנא נסו שוב.';
          messageDiv.className = 'message error';
          emailInput.setAttribute('aria-invalid', 'true');
        }
      } catch (error) {
        messageDiv.textContent = 'שגיאת תקשורת. אנא בדקו את החיבור לאינטרנט ונסו שוב.';
        messageDiv.className = 'message error';
        emailInput.setAttribute('aria-invalid', 'true');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'הצטרפות לרשימת התפוצה';
      }
    });
  </script>
</body>
</html>
