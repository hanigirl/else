<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>else</title>
  <meta name="description" content="הצטרפו למעצבי העל של העולם החדש">
  
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    @font-face {
      font-family: "Clash Display";
      src: url("/assets/fonts/clash-display-400.woff2") format("woff2");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "Clash Display";
      src: url("/assets/fonts/clash-display-500.woff2") format("woff2");
      font-weight: 500;
      font-display: swap;
    }

    :root {
      --color-indigo: #5651ed;
      --color-navy: #1a237e;
      --color-cobalt: #4a7af7;
      --color-white: #ffffff;
      --color-error: #d92d2d;
      --color-success: #069561;
      --color-success-soft: #d5fdee;
      --font-he: 'Noto Sans Hebrew', system-ui, sans-serif;
      --font-en: 'Clash Display', 'Noto Sans Hebrew', system-ui, sans-serif;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --dur-fast: 160ms;
      --dur-base: 320ms;
      --page-margin: 72px;
      --page-max: 1920px;
    }

    @media (max-width: 1279px) {
      :root {
        --page-margin: 40px;
      }
    }

    @media (max-width: 767px) {
      :root {
        --page-margin: 20px;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-he);
      color: var(--color-white);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      position: relative;
      isolation: isolate;
      background: linear-gradient(90deg, var(--color-navy), var(--color-cobalt));
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncR type='linear' slope='3' intercept='-1'/><feFuncG type='linear' slope='3' intercept='-1'/><feFuncB type='linear' slope='3' intercept='-1'/></feComponentTransfer></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      background-size: 256px;
      mix-blend-mode: overlay;
      opacity: 0.6;
    }

    body::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      --dot-cell: calc(min(100vw, 1920px) * 22 / 1920);
      opacity: 0.05;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='29' y='29' width='42' height='42' fill='white'/></svg>");
      background-size: var(--dot-cell) var(--dot-cell);
      background-position: left top;
      -webkit-mask: linear-gradient(115deg, transparent 40%, #000 75%);
      mask: linear-gradient(115deg, transparent 40%, #000 75%);
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: var(--page-max);
      margin: 0 auto;
      padding: 0 var(--page-margin);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-top: clamp(40px, 6vw, 80px);
      padding-bottom: clamp(40px, 6vw, 80px);
    }

    .blur-star {
      position: fixed;
      width: clamp(300px, 40vw, 600px);
      height: clamp(300px, 40vw, 600px);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }

    .blur-star::before {
      content: "";
      position: absolute;
      inset: -20%;
      background: radial-gradient(
        circle at center,
        rgba(255, 255, 255, 0.25) 0%,
        rgba(255, 255, 255, 0.12) 30%,
        transparent 60%
      );
      filter: blur(40px);
      animation: pulse 4s ease-in-out infinite;
    }

    .blur-star::after {
      content: "";
      position: absolute;
      inset: 0;
      background: 
        linear-gradient(0deg, rgba(255,255,255,0.08) 48%, transparent 52%),
        linear-gradient(90deg, rgba(255,255,255,0.08) 48%, transparent 52%),
        linear-gradient(45deg, rgba(255,255,255,0.06) 48%, transparent 52%),
        linear-gradient(135deg, rgba(255,255,255,0.06) 48%, transparent 52%);
      filter: blur(20px);
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
      max-width: 640px;
      margin: 0 auto;
      width: 100%;
    }

    .logo-img {
      width: clamp(60px, 7vw, 100px);
      height: auto;
      filter: brightness(0) invert(1);
      margin-bottom: clamp(2rem, 4vw, 3rem);
    }

    .headline {
      font-family: var(--font-he);
      font-weight: 700;
      font-size: 24px;
      line-height: 1.3;
      text-align: center;
      margin-bottom: clamp(3rem, 6vw, 4rem);
      color: var(--color-white);
    }

    .signup-box {
      width: 100%;
      max-width: 520px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    @media (max-width: 767px) {
      .form-row {
        grid-template-columns: 1fr;
      }
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-row .form-group {
      margin-bottom: 0;
    }

    .field-label {
      display: block;
      font-family: var(--font-he);
      font-weight: 500;
      font-size: 16px;
      line-height: 1.4;
      margin-bottom: 8px;
      color: rgba(255, 255, 255, 0.95);
    }

    .field-input {
      width: 100%;
      padding: 16px 20px;
      font-family: var(--font-he);
      font-size: 16px;
      font-weight: 500;
      line-height: 1.4;
      color: #383845;
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid transparent;
      border-radius: 8px;
      transition: all var(--dur-base) var(--ease-out);
      text-align: right;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      backdrop-filter: blur(10px);
    }

    .field-input:focus {
      outline: none;
      background: var(--color-white);
      border-color: rgba(255, 255, 255, 0.5);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(255, 255, 255, 0.3);
    }

    .field-input::placeholder {
      color: rgba(56, 56, 69, 0.4);
    }

    .field-input[aria-invalid="true"] {
      border-color: var(--color-error);
      box-shadow: 0 4px 16px rgba(217, 45, 45, 0.2);
    }

    .field-input[type="email"] {
      direction: ltr;
      text-align: left;
    }

    .consent-group {
      margin-bottom: 1.5rem;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .checkbox {
      appearance: none;
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      margin-top: 2px;
      border: 2px solid rgba(255, 255, 255, 0.6);
      border-radius: 4px;
      background: transparent;
      cursor: pointer;
      transition: all var(--dur-fast) var(--ease-out);
      position: relative;
    }

    .checkbox:hover {
      border-color: rgba(255, 255, 255, 0.9);
      background: rgba(255, 255, 255, 0.1);
    }

    .checkbox:checked {
      border-color: var(--color-white);
      background: var(--color-white);
    }

    .checkbox:checked::after {
      content: "";
      position: absolute;
      left: 5px;
      top: 1px;
      width: 6px;
      height: 11px;
      border: solid var(--color-navy);
      border-width: 0 2.5px 2.5px 0;
      transform: rotate(45deg);
    }

    .checkbox:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.8);
      outline-offset: 2px;
    }

    .checkbox[aria-invalid="true"] {
      border-color: var(--color-error);
    }

    .consent-label {
      font-family: var(--font-he);
      font-size: 15px;
      font-weight: 400;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.9);
    }

    .consent-label a {
      color: var(--color-white);
      text-decoration: underline;
      text-decoration-color: rgba(255, 255, 255, 0.5);
      transition: text-decoration-color var(--dur-base) var(--ease-out);
    }

    .consent-label a:hover {
      text-decoration-color: var(--color-white);
    }

    .submit-btn {
      width: 100%;
      padding: 18px 24px;
      font-family: var(--font-he);
      font-size: 18px;
      font-weight: 700;
      line-height: 1.4;
      color: var(--color-white);
      background: var(--color-indigo);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all var(--dur-base) var(--ease-out);
      box-shadow: 0 4px 16px rgba(86, 81, 237, 0.3);
    }

    .submit-btn:hover:not(:disabled) {
      background: #4743d4;
      box-shadow: 0 6px 24px rgba(86, 81, 237, 0.4);
      transform: translateY(-2px);
    }

    .submit-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      margin-top: 1rem;
      padding: 12px 16px;
      border-radius: 6px;
      font-family: var(--font-he);
      font-size: 15px;
      font-weight: 500;
      line-height: 1.4;
      text-align: center;
      backdrop-filter: blur(10px);
    }

    .message.success {
      background: rgba(213, 253, 238, 0.95);
      color: var(--color-success);
      box-shadow: 0 2px 12px rgba(6, 149, 97, 0.2);
    }

    .message.error {
      background: rgba(255, 238, 238, 0.95);
      color: var(--color-error);
      box-shadow: 0 2px 12px rgba(217, 45, 45, 0.2);
    }

    footer {
      text-align: center;
      margin-top: clamp(2rem, 4vw, 3rem);
    }

    .footer-text {
      font-family: var(--font-en);
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.02em;
      color: rgba(255, 255, 255, 0.5);
    }

    @media (max-width: 767px) {
      .blur-star {
        width: 280px;
        height: 280px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="blur-star" aria-hidden="true"></div>

  <div class="container">
    <main>
      <img src="/assets/logo.svg" alt="else" class="logo-img">

      <h1 class="headline">
        הצטרפו למעצבי העל של העולם החדש
      </h1>

      <div class="signup-box">
        <form id="signupForm" novalidate>
          <div class="form-group">
            <label for="email" class="field-label">כתובת מייל</label>
            <input 
              type="email" 
              id="email" 
              class="field-input" 
              placeholder="name@example.com"
              required
              autocomplete="email"
            >
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="firstName" class="field-label">שם פרטי</label>
              <input 
                type="text" 
                id="firstName" 
                class="field-input" 
                placeholder="שם פרטי"
                required
                autocomplete="given-name"
              >
            </div>

            <div class="form-group">
              <label for="lastName" class="field-label">שם משפחה</label>
              <input 
                type="text" 
                id="lastName" 
                class="field-input" 
                placeholder="שם משפחה"
                required
                autocomplete="family-name"
              >
            </div>
          </div>

          <div class="form-group">
            <label for="phone" class="field-label">טלפון (אופציונלי)</label>
            <input 
              type="tel" 
              id="phone" 
              class="field-input" 
              placeholder="050-1234567"
              autocomplete="tel"
            >
          </div>

          <div class="consent-group">
            <input 
              type="checkbox" 
              id="consent" 
              class="checkbox"
              required
            >
            <label for="consent" class="consent-label">
              בהצטרפות אני מאשר/ת את <a href="/terms-and-conditions" target="_blank">התקנון</a> ואת <a href="/privacy" target="_blank">מדיניות הפרטיות</a>
            </label>
          </div>

          <button type="submit" class="submit-btn" id="submitBtn">
            חני, צרפי אותי!
          </button>

          <div id="message"></div>
        </form>
      </div>
    </main>

    <footer>
      <p class="footer-text" lang="en">hani.buskila / else</p>
    </footer>
  </div>

  <script>
    const form = document.getElementById('signupForm');
    const emailInput = document.getElementById('email');
    const firstNameInput = document.getElementById('firstName');
    const lastNameInput = document.getElementById('lastName');
    const phoneInput = document.getElementById('phone');
    const consentCheckbox = document.getElementById('consent');
    const submitBtn = document.getElementById('submitBtn');
    const messageDiv = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      // Clear previous errors
      [emailInput, firstNameInput, lastNameInput, consentCheckbox].forEach(el => {
        el.removeAttribute('aria-invalid');
      });
      messageDiv.textContent = '';
      messageDiv.className = 'message';

      // Client-side validation
      let hasError = false;

      if (!emailInput.value.trim() || !emailInput.validity.valid) {
        emailInput.setAttribute('aria-invalid', 'true');
        hasError = true;
      }

      if (!firstNameInput.value.trim()) {
        firstNameInput.setAttribute('aria-invalid', 'true');
        hasError = true;
      }

      if (!lastNameInput.value.trim()) {
        lastNameInput.setAttribute('aria-invalid', 'true');
        hasError = true;
      }

      if (!consentCheckbox.checked) {
        consentCheckbox.setAttribute('aria-invalid', 'true');
        messageDiv.textContent = 'יש לאשר את התקנון ומדיניות הפרטיות';
        messageDiv.className = 'message error';
        hasError = true;
      }

      if (hasError) return;

      // Submit
      submitBtn.disabled = true;
      submitBtn.textContent = 'שולח...';

      try {
        const response = await fetch('/api/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: emailInput.value.trim(),
            firstName: firstNameInput.value.trim(),
            lastName: lastNameInput.value.trim(),
            phone: phoneInput.value.trim() || undefined
          })
        });

        const data = await response.json();

        if (response.ok) {
          messageDiv.textContent = 'תודה! נרשמת בהצלחה ✓';
          messageDiv.className = 'message success';
          form.reset();
        } else {
          messageDiv.textContent = data.error || 'משהו השתבש. אנא נסו שוב.';
          messageDiv.className = 'message error';
        }
      } catch (error) {
        messageDiv.textContent = 'שגיאת תקשורת. אנא בדקו את החיבור לאינטרנט ונסו שוב.';
        messageDiv.className = 'message error';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'חני, צרפי אותי!';
      }
    });
  </script>
</body>
</html>
