<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>else</title>
  <meta name="description" content="AI can make anything. We make something else.">
  
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --color-brand-blue: #1341e9;
      --color-ink: #383845;
      --color-white: #ffffff;
      --color-mist: #eff2fc;
      --color-error: #d92d2d;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }

    body {
      font-family: 'Noto Sans Hebrew', system-ui, sans-serif;
      background: var(--color-white);
      color: var(--color-ink);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }

    .logo {
      width: 200px;
      height: auto;
      margin-bottom: 3rem;
      opacity: 0;
      animation: fadeIn 0.6s var(--ease-out) 0.2s forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .tagline {
      font-size: 1.125rem;
      font-weight: 400;
      color: var(--color-ink);
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeIn 0.6s var(--ease-out) 0.4s forwards;
    }

    .signup-form {
      width: 100%;
      max-width: 420px;
      opacity: 0;
      animation: fadeIn 0.6s var(--ease-out) 0.6s forwards;
    }

    .form-group {
      position: relative;
      margin-bottom: 1rem;
    }

    .email-input {
      width: 100%;
      padding: 1rem 1.25rem;
      font-size: 1rem;
      font-family: inherit;
      border: 2px solid transparent;
      border-radius: 8px;
      background: var(--color-mist);
      color: var(--color-ink);
      transition: all 0.2s var(--ease-out);
      text-align: right;
    }

    .email-input:focus {
      outline: none;
      background: var(--color-white);
      border-color: var(--color-brand-blue);
    }

    .email-input::placeholder {
      color: rgba(56, 56, 69, 0.5);
    }

    .submit-btn {
      width: 100%;
      padding: 1rem 1.25rem;
      font-size: 1rem;
      font-weight: 500;
      font-family: inherit;
      color: var(--color-white);
      background: var(--color-brand-blue);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s var(--ease-out);
    }

    .submit-btn:hover:not(:disabled) {
      background: #0f35c4;
      transform: translateY(-1px);
    }

    .submit-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 6px;
      font-size: 0.9375rem;
      text-align: center;
      animation: slideDown 0.3s var(--ease-out);
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.success {
      background: #d5fdee;
      color: #069561;
    }

    .message.error {
      background: #fee;
      color: var(--color-error);
    }

    .privacy-link {
      margin-top: 3rem;
      opacity: 0;
      animation: fadeIn 0.6s var(--ease-out) 0.8s forwards;
    }

    .privacy-link a {
      color: var(--color-brand-blue);
      text-decoration: none;
      font-size: 0.9375rem;
      transition: opacity 0.2s var(--ease-out);
    }

    .privacy-link a:hover {
      opacity: 0.7;
    }

    footer {
      padding: 2rem;
      text-align: center;
      font-size: 0.875rem;
      color: rgba(56, 56, 69, 0.6);
      opacity: 0;
      animation: fadeIn 0.6s var(--ease-out) 1s forwards;
    }

    @media (max-width: 767px) {
      .container {
        padding: 1.5rem;
      }

      .logo {
        width: 160px;
        margin-bottom: 2rem;
      }

      .tagline {
        font-size: 1rem;
        margin-bottom: 2rem;
      }

      .email-input,
      .submit-btn {
        padding: 0.875rem 1rem;
      }

      .privacy-link {
        margin-top: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/assets/logo.svg" alt="else" class="logo">
    
    <p class="tagline">AI can make anything. We make something else.</p>
    
    <form class="signup-form" id="signupForm">
      <div class="form-group">
        <input 
          type="email" 
          id="email" 
          class="email-input" 
          placeholder="כתובת המייל שלך"
          required
          autocomplete="email"
          dir="ltr"
        >
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">
        הצטרפות לרשימת התפוצה
      </button>
      <div id="message"></div>
    </form>

    <div class="privacy-link">
      <a href="/privacy">מדיניות פרטיות</a>
    </div>
  </div>

  <footer>
    Hani Buskila / else
  </footer>

  <script>
    const form = document.getElementById('signupForm');
    const emailInput = document.getElementById('email');
    const submitBtn = document.getElementById('submitBtn');
    const messageDiv = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = emailInput.value.trim();
      if (!email) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'שולח...';
      messageDiv.textContent = '';
      messageDiv.className = 'message';

      try {
        const response = await fetch('/api/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await response.json();

        if (response.ok) {
          messageDiv.textContent = 'תודה! נרשמת בהצלחה לרשימת התפוצה ✓';
          messageDiv.className = 'message success';
          emailInput.value = '';
        } else {
          messageDiv.textContent = data.error || 'משהו השתבש. אנא נסו שוב.';
          messageDiv.className = 'message error';
        }
      } catch (error) {
        messageDiv.textContent = 'שגיאת תקשורת. אנא בדקו את החיבור לאינטרנט ונסו שוב.';
        messageDiv.className = 'message error';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'הצטרפות לרשימת התפוצה';
      }
    });
  </script>
</body>
</html>
